# Docker Compose file for the distributed notification system.
# Phase 3: RabbitMQ + Redis.
# Future phases will add PostgreSQL.

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notif-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port (used by the Go clients)
      - "15672:15672" # Management UI (http://localhost:15672, guest/guest)

  redis:
    image: redis:7-alpine
    container_name: notif-redis
    ports:
      - "6379:6379"   # Redis protocol port (used by the analytics worker)
